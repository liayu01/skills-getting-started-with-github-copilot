<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>备忘录 · Todo App</title>
    <link rel="stylesheet" href="todo.css" />
  </head>
  <body>
    <!-- ===== App Shell ===== -->
    <div id="app">

      <!-- Sidebar -->
      <aside id="sidebar">
        <div id="sidebar-header">
          <span class="app-icon">📝</span>
          <h1>备忘录</h1>
        </div>

        <nav id="filters">
          <button class="filter-btn active" data-filter="all">
            <span class="filter-icon">📋</span> 全部
            <span class="badge" id="badge-all">0</span>
          </button>
          <button class="filter-btn" data-filter="active">
            <span class="filter-icon">🔄</span> 进行中
            <span class="badge" id="badge-active">0</span>
          </button>
          <button class="filter-btn" data-filter="completed">
            <span class="filter-icon">✅</span> 已完成
            <span class="badge" id="badge-completed">0</span>
          </button>
          <button class="filter-btn" data-filter="reminder">
            <span class="filter-icon">⏰</span> 有提醒
            <span class="badge" id="badge-reminder">0</span>
          </button>
        </nav>

        <div id="tags-section">
          <h3>标签</h3>
          <div id="tag-filter-list">
            <!-- tag pills injected here -->
          </div>
        </div>

        <button id="add-todo-btn" class="primary-btn">
          <span>＋</span> 新建任务
        </button>
      </aside>

      <!-- Main Content -->
      <main id="main">

        <div id="toolbar">
          <input id="search-input" type="text" placeholder="🔍  搜索任务…" />
          <select id="sort-select">
            <option value="newest">最新创建</option>
            <option value="oldest">最早创建</option>
            <option value="progress">进度</option>
            <option value="reminder">提醒时间</option>
          </select>
        </div>

        <div id="todo-list">
          <div class="empty-state" id="empty-state">
            <p>🎉 暂无任务，点击「新建任务」开始吧！</p>
          </div>
        </div>
      </main>
    </div>

    <!-- ===== Add / Edit Modal ===== -->
    <div id="modal-overlay" class="hidden">
      <div id="modal">
        <div id="modal-header">
          <h2 id="modal-title">新建任务</h2>
          <button id="modal-close" aria-label="关闭">✕</button>
        </div>

        <div id="modal-body">
          <div class="field">
            <label for="field-title">标题 <span class="required">*</span></label>
            <input id="field-title" type="text" placeholder="输入任务标题…" maxlength="120" />
          </div>

          <div class="field">
            <label for="field-desc">描述 / 备注</label>
            <textarea id="field-desc" rows="3" placeholder="补充说明…"></textarea>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="field-reminder">⏰ 日期时间提醒</label>
              <input id="field-reminder" type="datetime-local" />
            </div>
            <div class="field">
              <label for="field-progress">进度 <span id="progress-label">0%</span></label>
              <input id="field-progress" type="range" min="0" max="100" value="0" step="5" />
            </div>
          </div>

          <div class="field">
            <label>标签</label>
            <div id="tag-input-area">
              <div id="tag-chips"></div>
              <input id="tag-input" type="text" placeholder="输入标签后按 Enter 或逗号添加…" />
            </div>
            <div id="tag-suggestions"></div>
          </div>
        </div>

        <div id="modal-footer">
          <button id="modal-cancel" class="secondary-btn">取消</button>
          <button id="modal-save" class="primary-btn">保存</button>
        </div>
      </div>
    </div>

    <!-- ===== Notification toast ===== -->
    <div id="toast-container"></div>

    <script src="todo.js"></script>
  </body>
</html>
